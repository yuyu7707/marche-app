{% extends "base.html" %}
{% block title %}お支払いの中断 | はちまん産直マルシェ{% endblock %}
{% block content %}
<h1>お支払いを中断しました</h1>
{% if order.status == 'pending' %}
<p>注文 #{{ order.id }}（{{ order.total_amount|yen }}）はまだ支払われていません。</p>
<form method="post" action="{{ url_for('orders.cancel', order_id=order.id) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit">この注文を取り消す</button>
</form>
{% else %}
<p>この注文の状態：<strong>{{ order.status_label }}</strong></p>
{% endif %}
<p><a href="{{ url_for('orders.show', order_id=order.id) }}">注文の詳細を見る</a></p>
{% endblock %}
