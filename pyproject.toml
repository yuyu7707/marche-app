[project]
name = "marche-app"
version = "0.1.0"
description = "はちまん産直マルシェ（八幡平市スパルタキャンプ 2026年11月 Python編）"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.11.0",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "python-dotenv>=1.2.4",
    "stripe>=16.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
# Flask-Migrate が自動で作るファイルは、Ruff の対象から外す
extend-exclude = ["migrations"]
